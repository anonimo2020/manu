<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#a9d6ea">
<title>Para Manu</title>
<script>
/* El momento del día se decide antes de pintar, para que no parpadee la paleta. */
(function () {
  var h = new Date().getHours();
  document.documentElement.dataset.m = h >= 5 && h < 12 ? "manana" : h >= 12 && h < 18 ? "tarde" : "noche";
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --sky:linear-gradient(180deg,#a9d6ea 0%,#f6d3df 55%,#ffd9b0 100%);
  --ink:#3a1f3d; --soft:#684266; --glass:rgba(255,255,255,.5); --line:rgba(58,31,61,.22);
  --btn-bg:#3a1f3d; --btn-ink:#ffeef3;
  --orb-size:7.5rem;
  --orb-bg:radial-gradient(circle at 40% 38%,#fffbe0 0%,#ffe48a 45%,#ffbf6b 100%);
  --orb-shadow:0 0 3.5rem 1.2rem rgba(255,214,120,.55),0 0 10rem 3.5rem rgba(255,190,140,.35);
  --orb-filter:none;
}
html[data-m="tarde"]{
  --sky:linear-gradient(180deg,#34225f 0%,#a8407a 52%,#c24d62 100%);
  --ink:#fff3ea; --soft:#ffd9dc; --glass:rgba(40,12,58,.3); --line:rgba(255,243,234,.3);
  --btn-bg:#fff3ea; --btn-ink:#4a1d4f;
  --orb-size:9.5rem;
  --orb-bg:radial-gradient(circle at 40% 40%,#fff0c4 0%,#ffb35c 42%,#ff6a5a 100%);
  --orb-shadow:0 0 4rem 1.4rem rgba(255,120,90,.55),0 0 11rem 4rem rgba(255,90,120,.35);
}
html[data-m="noche"]{
  --sky:linear-gradient(180deg,#0c0d2b 0%,#231a4f 55%,#4a2a63 100%);
  --ink:#f6eaf4; --soft:#d3c0e0; --glass:rgba(255,255,255,.08); --line:rgba(246,234,244,.28);
  --btn-bg:#f6eaf4; --btn-ink:#231a4f;
  --orb-size:6rem;
  --orb-bg:transparent;
  --orb-shadow:inset -1.4rem .4rem 0 0 #f3ecd6;
  --orb-filter:drop-shadow(0 0 1.6rem rgba(243,236,214,.5));
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--sky);color:var(--ink)}
body{margin:0;min-height:100svh;font-family:"DM Sans",system-ui,sans-serif;font-size:1rem;line-height:1.5}
#estrellas{position:fixed;inset:0;pointer-events:none;z-index:0}
#estrellas i{position:absolute;border-radius:50%;background:#fff}
main{position:relative;z-index:1;width:min(34rem,100%);margin:0 auto;padding:13rem 1.5rem 2.5rem}
.orb{position:absolute;top:2.5rem;right:1.5rem;width:var(--orb-size);height:var(--orb-size);border-radius:50%;
  background:var(--orb-bg);box-shadow:var(--orb-shadow);filter:var(--orb-filter);
  animation:subir 2.4s cubic-bezier(.2,.7,.2,1) both}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(3rem,13vw,4.75rem);line-height:.98;
  letter-spacing:-.01em;margin:0;text-wrap:balance;animation:aparecer 1.4s .5s ease both}
#saludo{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:clamp(1.6rem,6vw,2.2rem);
  line-height:1.2;color:var(--soft);margin:.7rem 0 0;animation:aparecer 1.4s .8s ease both}
#frase{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(1.3rem,4.6vw,1.6rem);line-height:1.45;
  max-width:26em;margin:2.5rem 0 3rem;animation:aparecer 1.4s 1.1s ease both}
#seguir{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:1.2rem;color:var(--soft);margin:-2rem 0 3rem;animation:aparecer 1.4s 1.3s ease both}
#frase:empty,#saludo:empty,#seguir:empty{display:none}
form{display:flex;flex-direction:column;animation:aparecer 1.4s 1.3s ease both}
textarea{font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:22px;
  padding:1rem 1.15rem;min-height:7rem;resize:vertical;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
textarea::placeholder{color:var(--soft);opacity:.85}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button{font:inherit;font-weight:500;color:var(--btn-ink);background:var(--btn-bg);border:0;border-radius:999px;
  padding:.95rem 1.4rem;margin-top:.8rem;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
button:hover{opacity:.92}
button:active{transform:scale(.98)}
button:disabled{opacity:.65;cursor:wait}
#resp{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(1.35rem,4.8vw,1.6rem);line-height:1.45;
  margin:2rem 0 0;white-space:pre-wrap;opacity:0;transition:opacity .9s ease}
#resp.ver{opacity:1}
footer{margin-top:3.5rem;font-size:.9rem;color:var(--soft)}
@keyframes subir{from{transform:translateY(7rem);opacity:0}to{transform:none;opacity:1}}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .orb,h1,#saludo,#frase,#seguir,form{animation:none}
  #resp{transition:none}
  button{transition:none}
}
</style>
</head>
<body>
<div id="estrellas" aria-hidden="true"></div>
<main>
  <div class="orb" aria-hidden="true"></div>
  <h1>Bienvenida, Manu</h1>
  <p id="saludo"></p>
  <p id="frase"></p>
  <p id="seguir"></p>
  <form id="f">
    <textarea id="t" maxlength="500" required aria-label="Cuéntame cómo te sientes" placeholder="Escribe aquí…"></textarea>
    <button id="b" type="submit">¿Cómo te sientes hoy, cariño?</button>
  </form>
  <p id="resp" aria-live="polite"></p>
  <footer>Hecho con mucho cariño, para Manu <span aria-hidden="true">♥</span></footer>
</main>
<script>
const $ = id => document.getElementById(id);
const m = document.documentElement.dataset.m;
const hola = {manana: "Buenos días", tarde: "Buenas tardes", noche: "Buenas noches"}[m];
const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;
const leer = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

document.querySelector('meta[name="theme-color"]').content =
  {manana: "#a9d6ea", tarde: "#34225f", noche: "#0c0d2b"}[m];

if (m === "noche") {
  const caja = $("estrellas"), frag = document.createDocumentFragment();
  for (let i = 0; i < 55; i++) {
    const s = document.createElement("i"), tam = 1 + Math.random() * 1.8;
    s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 30}%;width:${tam}px;height:${tam}px;opacity:${0.25 + Math.random() * 0.7}`;
    frag.appendChild(s);
  }
  caja.appendChild(frag);
}

(async () => {
  const vistas = leer("vistas");
  try {
    const r = await (await fetch("/api/frase", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({momento: m, vistas})})).json();
    $("saludo").textContent = `${hola}.`;
    $("frase").textContent = r.frase;
    $("seguir").textContent = r.seguir || "";
    guardar("vistas", r.reinicio ? [r.id] : [...vistas, r.id]);
  } catch {
    $("saludo").textContent = `${hola}.`;
  }
})();

const historial = [];
const boton = $("b"), textoBoton = boton.textContent;
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const texto = $("t").value.trim();
  if (!texto) return;
  historial.push({role: "user", text: texto});
  boton.disabled = true;
  boton.textContent = "Un momento, cariño…";
  $("resp").classList.remove("ver");
  let respuesta = "";
  try {
    const r = await (await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({mensajes: historial})})).json();
    respuesta = r.respuesta || "";
    if (respuesta) { historial.push({role: "assistant", text: respuesta}); $("t").value = ""; }
    else { respuesta = "No pude responder ahora. Intenta de nuevo en un momento."; historial.pop(); }
  } catch {
    respuesta = "No hay conexión. Intenta de nuevo en un momento.";
    historial.pop();
  }
  $("resp").textContent = respuesta;
  requestAnimationFrame(() => $("resp").classList.add("ver"));
  $("resp").scrollIntoView({behavior: reducir ? "auto" : "smooth", block: "nearest"});
  boton.textContent = textoBoton;
  boton.disabled = false;
});
</script>
</body>
</html>
