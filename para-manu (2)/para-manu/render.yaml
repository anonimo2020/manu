services:
  - type: web
    name: para-manu
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: VENICE_API_KEY
        sync: false
      - key: VENICE_MODEL
        value: zai-org-glm-5-2
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: lopenai/gpt-oss-120b
